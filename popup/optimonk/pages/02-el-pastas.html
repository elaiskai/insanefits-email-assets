<style>
@import url("https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap");
</style>
<style>
.op-card,
.op-card * {
  box-sizing: border-box;
}

.op-card {
  --orange: #ff5a00;
  position: relative;
  isolation: isolate;
  display: flex;
  flex-direction: column;
  width: 100%;
  max-width: 600px;
  height: 600px;
  margin: 0 auto;
  padding: 28px clamp(22px, 6vw, 44px) 24px;
  overflow: hidden;
  background:
    linear-gradient(180deg, transparent 38%, rgba(25, 20, 18, .16) 52%, rgba(28, 18, 14, .92) 76%, #2f190f 100%),
    #1d1a19 url("https://raw.githubusercontent.com/elaiskai/insanefits-email-assets/main/popup/optimonk/assets/popup-scene.jpg") center top / cover no-repeat;
  color: #fff;
  text-align: center;
  font-family: Montserrat, Arial, sans-serif;
}

.op-logo {
  display: block;
  width: clamp(132px, 32vw, 164px);
  height: auto;
  margin: 0 auto;
}

.op-content {
  display: flex;
  flex: 1;
  flex-direction: column;
  justify-content: flex-end;
  min-height: 0;
}

.op-card h2 {
  margin: 0;
  color: #fff;
  font-size: clamp(26px, 6vw, 34px);
  font-weight: 800;
  line-height: 1.12;
  letter-spacing: -.8px;
}

.op-card h2 strong {
  display: block;
  margin-top: 4px;
  color: var(--orange);
  font-size: clamp(35px, 9vw, 50px);
  line-height: 1.05;
  letter-spacing: -1.5px;
}

.op-copy {
  max-width: 390px;
  margin: 10px auto 14px;
  color: #eee8e4;
  font-size: 13px;
  line-height: 1.5;
}

.op-primary {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  min-height: 52px;
  margin-top: 18px;
  padding: 14px 16px;
  border: 0;
  border-radius: 8px;
  background: var(--orange);
  color: #fff;
  font: 800 15px/1.3 Montserrat, Arial, sans-serif;
  text-decoration: none;
  cursor: pointer;
}

.op-quiet {
  min-height: 40px;
  margin: 6px auto 0;
  padding: 8px 12px;
  border: 0;
  background: transparent;
  color: #eee8e4;
  font: 500 12px/1.4 Montserrat, Arial, sans-serif;
  text-decoration: underline;
  cursor: pointer;
}

.op-email .op-content {
  flex: none;
  margin-top: auto;
  padding: 16px;
  border: 1px solid rgba(255, 255, 255, .1);
  border-radius: 12px;
  background: rgba(22, 16, 14, .9);
  box-shadow: 0 16px 40px rgba(0, 0, 0, .24);
}

.op-email h2,
.op-thanks h2 {
  font-size: clamp(24px, 5vw, 30px);
}

.op-email h2 strong,
.op-thanks h2 strong {
  font-size: clamp(29px, 7vw, 38px);
}

.op-label {
  display: block;
  margin: 0 0 5px;
  color: #fff;
  text-align: left;
  font-size: 12px;
  font-weight: 600;
}

.op-input {
  display: block;
  width: 100%;
  height: 48px;
  padding: 0 14px;
  border: 1px solid rgba(255, 255, 255, .7);
  border-radius: 7px;
  background: #fff;
  color: #1c1c1c;
  font: 400 15px/1.4 Montserrat, Arial, sans-serif;
}

.op-consent {
  display: flex;
  gap: 9px;
  align-items: flex-start;
  margin: 10px 0 0;
  color: #eee8e4;
  text-align: left;
  font-size: 10px;
  line-height: 1.45;
}

.op-consent input {
  flex: 0 0 18px;
  width: 18px;
  height: 18px;
  margin: 1px 0 0;
  accent-color: var(--orange);
}

.op-consent a {
  color: inherit;
  text-decoration: underline;
}

.op-email .op-primary {
  margin-top: 12px;
}

.op-thanks .op-content {
  padding-bottom: 12px;
}

@media (max-width: 420px) {
  .op-card {
    height: 580px;
    padding: 22px 22px 18px;
    background-position: center top;
  }

  .op-logo {
    width: 136px;
  }

  .op-card h2 {
    font-size: 27px;
  }

  .op-card h2 strong {
    font-size: 39px;
  }

  .op-primary {
    margin-top: 15px;
  }

  .op-email h2,
  .op-thanks h2 {
    font-size: 24px;
  }

  .op-email h2 strong,
  .op-thanks h2 strong {
    font-size: 30px;
  }
}

@media (max-height: 540px) {
  .op-card {
    height: 520px;
    padding-top: 18px;
    padding-bottom: 14px;
  }

  .op-logo {
    width: 122px;
  }

  .op-card h2 {
    font-size: 23px;
  }

  .op-card h2 strong {
    font-size: 32px;
  }

  .op-copy {
    margin: 7px auto 10px;
  }
}

</style>
<section class="op-card op-email" lang="lt">
  <img class="op-logo" src="https://raw.githubusercontent.com/elaiskai/insanefits-email-assets/main/logo/insane-labs-logo-white-900.png" alt="Insane Labs">
  <div class="op-content">
    <h2>Kur siųsti tavo<strong>10% nuolaidą?</strong></h2>
    <p class="op-copy">Įvesk el. paštą, atsiųsime nuolaidos kodą.</p>
    <label class="op-label" for="op-email">El. paštas</label>
    <input class="op-input" id="op-email" name="email" type="email" placeholder="tavo@pastas.lt" autocomplete="email" required>
    <label class="op-consent">
      <input id="op-consent" name="marketing_consent" type="checkbox" required>
      <span>Sutinku gauti naujienas ir pasiūlymus el. paštu. Prenumeratos galiu atsisakyti bet kada. <a href="https://insanefits.com/pages/privatumas" target="_blank" rel="noopener">Privatumo politika</a>.</span>
    </label>
    <button class="op-primary" type="button" id="op-subscribe">GAUTI 10% NUOLAIDĄ</button>
  </div>
</section>
