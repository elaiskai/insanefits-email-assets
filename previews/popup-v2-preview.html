<!doctype html><html lang="lt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet"><title>Insane Fits popup v2</title><style>body{margin:0;padding:28px 12px;background:#8f8f8f;font-family:Arial,sans-serif;}</style></head><body>
<!-- ============================================================
     Insane Fits · signup pop-up v2 (responsive fix, 2026-09-22)
     Maks. plotis 600 px · fluid · nieko fiksuoto aukscio
     HERO: pakeisk tik sita viena URL (rekomenduojamas 1200x600 JPG)
     ============================================================ -->
<style>
  .ilp, .ilp * { box-sizing: border-box; }
  .ilp img { -ms-interpolation-mode: bicubic; }
  .ilp .ilp-btn:hover { background: #e04e00 !important; }
  .ilp .ilp-no:hover { opacity: 1 !important; }
  @media (min-width: 481px) {
    .ilp .ilp-body   { padding: 30px 36px 34px !important; }
    .ilp .ilp-logo   { width: 160px !important; }
    .ilp .ilp-h2     { font-size: 32px !important; }
    .ilp .ilp-h2 span{ font-size: 46px !important; }
    .ilp .ilp-btn    { font-size: 18px !important; padding: 19px 16px !important; }
    .ilp .ilp-no     { font-size: 15px !important; }
  }
</style>

<div class="ilp" lang="lt" style="width:100%;max-width:600px;margin:0 auto;background:#201c1b;border-radius:14px;overflow:hidden;font-family:Montserrat,'Helvetica Neue',Arial,sans-serif;color:#ffffff;text-align:center;">

  <!-- HERO (1200x600 JPG). Nera fiksuoto aukscio - skaliuojasi pagal plotį. -->
  <img class="ilp-hero"
       src="https://cdn.jsdelivr.net/gh/elaiskai/insanefits-email-assets@5c217045aff41dd488700cf135cfcd2638314e87/popup/hero-popup-v1.jpg"
       alt=""
       style="display:block;width:100%;height:auto;border:0;outline:none;background:#201c1b;">

  <!-- perejimas nuo nuotraukos i foną -->
  <div style="position:relative;margin-top:-26px;height:26px;background:linear-gradient(180deg,rgba(32,28,27,0) 0%,#201c1b 100%);"></div>

  <div class="ilp-body" style="padding:22px 20px 26px;">

    <img class="ilp-logo"
         src="https://cdn.jsdelivr.net/gh/elaiskai/insanefits-email-assets@3c961afcd0ba9cf1d79193006f92eb78889ecd5c/logo/insane-labs-logo-white-900.png"
         alt="Insane Labs"
         style="display:block;width:132px;height:auto;max-width:60%;margin:0 auto 16px;border:0;">

    <h2 class="ilp-h2" style="margin:0;color:#ffffff;font-size:24px;font-weight:800;line-height:1.25;">
      Nori gauti
      <span style="display:block;margin-top:6px;color:#ff5a00;font-size:34px;line-height:1.1;">10% nuolaidą?</span>
    </h2>

    <button class="ilp-btn" type="button" id="il-next"
            style="display:block;width:100%;margin:20px 0 0;padding:17px 16px;border:0;border-radius:10px;background:#ff5a00;color:#ffffff;font-family:inherit;font-size:16px;font-weight:800;line-height:1.3;letter-spacing:.02em;cursor:pointer;">
      TAIP, NORIU
    </button>

    <button class="ilp-no" type="button" id="il-dismiss"
            style="display:block;width:100%;margin:6px 0 0;padding:12px 16px;border:0;background:transparent;color:#ffffff;opacity:.72;font-family:inherit;font-size:14px;font-weight:500;line-height:1.5;text-decoration:underline;cursor:pointer;">
      NE, AČIŪ
    </button>

  </div>
</div>

</body></html>
